<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말판 원정대</title>
<!-- PWA: 홈 화면에 설치하면 주소창 없이 앱처럼 열린다 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4EADB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말판 원정대">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
<!-- 글꼴: Gasoek One(제목·결과 도장) · Pretendard(본문) — 둘 다 SIL OFL, 상업 이용 무료 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="src/ui/styles.css">
<!-- three.js: 3D 굴림 도구(윷가락·주사위). 못 불러오면 2D 그림으로 돌아간다 -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"><div class="app" id="app"></div></div>
<script type="module" src="src/ui/app.js"></script>
<script>
  // 오프라인 캐시(sw.js). 개발 서버(localhost)에서는 캐시가 수정 확인을 방해하지 않게 등록하지 않는다.
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
