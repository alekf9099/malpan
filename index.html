<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>역전(驛戰): 역을 차지하라</title>
<!-- PWA: 홈 화면에 설치하면 주소창 없이 앱처럼 열린다 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4EADB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="역전">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
<!-- 글꼴: Gasoek One(제목·결과 도장) · Pretendard(본문) — 둘 다 SIL OFL, 상업 이용 무료 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="src/ui/styles.css">
<!-- three.js: 3D 열차 주사위. 못 불러오면 2D 그림으로 돌아간다 -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"><div class="app" id="app"></div></div>
<!-- 세로로 들면: 가로로 돌려 달라는 안내(세로로 계속할 수도 있다) -->
<div class="rotate-ask" id="rotateAsk" role="dialog" aria-label="가로로 돌려 주세요">
  <svg viewBox="0 0 120 90" width="132" height="99" aria-hidden="true"><rect class="ra-phone" x="38" y="8" width="44" height="74" rx="9" fill="#FFFDF7" stroke="#22201D" stroke-width="4"/><rect class="ra-screen" x="44" y="16" width="32" height="54" rx="3" fill="#2FA84F"/><path class="ra-arrow" d="M96 30 A34 34 0 0 1 96 62" fill="none" stroke="#E0533D" stroke-width="5" stroke-linecap="round"/><path class="ra-arrow" d="M90 60 L96 66 L101 58" fill="none" stroke="#E0533D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <b>가로로 돌려 주세요</b>
  <span>역전은 가로 화면에서 판이 크게 보여요</span>
  <button type="button" id="keepPortrait">세로로 계속</button>
</div>
<script type="module" src="src/ui/app.js"></script>
<script>
  // 오프라인 캐시(sw.js). 개발 서버(localhost)에서는 캐시가 수정 확인을 방해하지 않게 등록하지 않는다.
  if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
