<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 렌더러</title>
<!--
  Kenney Mini Characters(CC0) 3D 모델을 판과 같은 시점(세로 눌림 0.58 = 고도 약 35.4°, 45° 회전)으로
  찍어 스프라이트 시트(WebP, 동작 5줄 × 8프레임)로 만든다. 개발용 도구 — 게임은 결과 그림만 쓴다.
  tools/save-server.py 로 열고 ?save 를 붙이면 assets/chars/ 에 바로 저장한다.
-->
<style>
  body { margin: 0; padding: 16px; background: #F4EBDD; font: 14px sans-serif; }
  #out { display: flex; flex-direction: column; gap: 8px; }
  #out img { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; image-rendering: auto; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="status">준비 중…</div>
<div id="out"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const SAVE = params.has('save');
// ?icon 이면 앱 아이콘용으로 기관사 환호 한 장만 크게 찍는다(tools/make-icons.py 가 쓴다)
const ICON = params.has('icon');
const FRAME = ICON ? 512 : 160; // 한 프레임 크기(px)
const FRAMES = ICON ? 1 : 8;    // 동작당 프레임 수
const INK = '#22201D';
const OUTLINE = 6 * FRAME / 160; // 먹선 두께(px)
const ELEV = Math.asin(0.58);
const AZIM = Math.PI / 4;

// 게임 캐릭터 id → 모델. 사람 넷은 Kenney Mini Characters(CC0, assets/models/mini/)이고, 팩마다 크기가 달라 키(height)를 맞춘다.
// ?set=mini 면 팩의 12명을 다 찍어 비교한다(저장하지 않고 볼 때).
const CAST = {
  driver:  { model: 'mini/character-male-c', height: 1.75 },   // 기관사 — 파란 모자 제복
  staff:   { model: 'mini/character-female-d', height: 1.75 }, // 역무원 — 회색 정장
  worker:  { model: 'mini/character-male-e', height: 1.75 },   // 직장인 — 흰 셔츠·넥타이·안경
  student: { model: 'mini/character-female-b', height: 1.75 }  // 대학생 — 노란 옷·양갈래 머리
};
// Mini Characters 에는 춤이 없어 점프로 대신한다
const ACTIONS = { idle: 'idle', walk: 'walk', cheer: 'emote-yes', sad: 'emote-no', dance: 'jump' };
if (params.get('set') === 'mini') {
  for (const k of Object.keys(CAST)) delete CAST[k];
  for (const g of ['male', 'female']) for (const v of 'abcdef') CAST[`${g}-${v}`] = { model: `mini/character-${g}-${v}`, height: 1.75 };
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
const RS = FRAME * 2; // 두 배로 찍고 줄여서 가장자리를 부드럽게
renderer.setSize(RS, RS);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a7a68, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-2, 5, 3);
scene.add(sun);

const loader = new GLTFLoader();
const load = (name) => new Promise((ok, no) => loader.load(`../assets/models/${name}.glb`, ok, undefined, no));

// 모든 캐릭터가 같은 크기로 보이도록 화면 틀은 하나로 고정한다
const VIEW = 2.75;    // 직교 카메라 세로 폭(월드 단위). 모델 높이 1.5~2.0
const FOOT = 0.8;    // 땅 한가운데가 놓이는 높이(프레임 위에서 아래로 비율)
const cam = new THREE.OrthographicCamera(-VIEW / 2, VIEW / 2, VIEW / 2, -VIEW / 2, 0.1, 50);
const D = 10;
cam.position.set(D * Math.cos(ELEV) * Math.sin(AZIM), D * Math.sin(ELEV), D * Math.cos(ELEV) * Math.cos(AZIM));
cam.lookAt(0, 0, 0);
// 땅(원점)이 FOOT 위치에 오도록 화면을 아래로 민다
const shift = (FOOT - 0.5) * VIEW;
cam.top += shift; cam.bottom += shift;
cam.updateProjectionMatrix();

function outline(src) {
  // 알파를 둥글게 번지게 해 먹선을 깔고, 그 위에 원본을 얹는다
  const c = document.createElement('canvas');
  c.width = c.height = FRAME;
  const g = c.getContext('2d');
  const ink = document.createElement('canvas');
  ink.width = ink.height = FRAME;
  const ig = ink.getContext('2d');
  ig.drawImage(src, 0, 0, FRAME, FRAME);
  ig.globalCompositeOperation = 'source-in';
  ig.fillStyle = INK;
  ig.fillRect(0, 0, FRAME, FRAME);
  for (let a = 0; a < 16; a++) {
    const t = (a / 16) * Math.PI * 2;
    g.drawImage(ink, Math.cos(t) * OUTLINE, Math.sin(t) * OUTLINE);
  }
  g.drawImage(src, 0, 0, FRAME, FRAME);
  return c;
}

async function renderCast(kind, spec) {
  const gltf = await load(spec.model);
  const root = gltf.scene;
  if (spec.height) {
    // 팩마다 모델 크기가 달라 키를 맞춘다(발은 땅에)
    const box = new THREE.Box3().setFromObject(root);
    root.scale.setScalar(spec.height / (box.max.y - box.min.y));
    root.position.y -= box.min.y * root.scale.y;
  }
  scene.add(root);
  const mixer = new THREE.AnimationMixer(root);
  const sheets = {};
  for (const [act, clipName] of Object.entries(ACTIONS)) {
    if (ICON && act !== 'cheer') continue;
    const clip = gltf.animations.find((a) => a.name === clipName);
    const sheet = document.createElement('canvas');
    sheet.width = FRAME * FRAMES; sheet.height = FRAME;
    const sg = sheet.getContext('2d');
    mixer.stopAllAction();
    const action = mixer.clipAction(clip);
    action.reset().play();
    for (let f = 0; f < FRAMES; f++) {
      mixer.setTime((clip.duration * f) / FRAMES);
      renderer.render(scene, cam);
      sg.drawImage(outline(renderer.domElement), f * FRAME, 0);
    }
    sheets[act] = sheet;
  }
  scene.remove(root);
  return sheets;
}

async function save(name, canvas) {
  const blob = await new Promise((ok) => canvas.toBlob(ok, 'image/webp', 0.88));
  const r = await fetch(`/save/${name}`, { method: 'POST', body: blob });
  if (!r.ok) throw new Error('save failed ' + name);
}

const out = document.getElementById('out');
const only = params.get('only');
for (const [kind, spec] of Object.entries(CAST)) {
  if (only && !only.split(',').includes(kind)) continue;
  if (ICON && kind !== 'driver') continue;
  document.getElementById('status').textContent = kind + ' 렌더링…';
  const sheets = await renderCast(kind, spec);
  // 한 캐릭터의 동작을 세로로 이어 붙인 시트 하나로 저장한다(행 순서 = ACTIONS 순서)
  const all = document.createElement('canvas');
  const acts = Object.keys(sheets);
  all.width = FRAME * FRAMES; all.height = FRAME * acts.length;
  acts.forEach((a, i) => all.getContext('2d').drawImage(sheets[a], 0, i * FRAME));
  const img = new Image();
  img.src = all.toDataURL();
  img.width = all.width / 2;
  out.append(kind, img);
  if (SAVE && ICON) { await save('driver-icon.png', all); continue; }
  if (SAVE) await save(`${kind.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase())}.webp`, all);
}
document.getElementById('status').textContent = '끝';
window.renderDone = true;
</script>
</body>
</html>
