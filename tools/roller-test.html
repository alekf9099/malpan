<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>열차 주사위 확인</title>
<!-- 개발용: 3D 열차 주사위의 결과 면이 모두 똑바로 보이는지 한눈에 확인한다 -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  body { margin: 0; padding: 12px; background: #F4EADB; font: 13px sans-serif; display: grid; grid-template-columns: repeat(2, 220px); gap: 8px; }
  .cell { background: #fff8; border: 1px solid #ccc; }
  .cell div { width: 220px; height: 110px; }
  .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cell span { display: block; padding: 2px 6px; }
</style>
</head>
<body>
<script type="module">
import * as R3 from '../src/ui/roller3d.js';
import { BOARDS } from '../src/core/boards/index.js';
import { METRO_FACES } from '../src/core/boards/seoul.js';
await R3.load();
const board = BOARDS.metro;
const cases = METRO_FACES.map((f) => [{ face: f }, f === 'express' ? '급행' : `${f}역`]);
cases.push([null, '대기']);
for (const [roll, label] of cases) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<div></div><span>열차 주사위 · ${label}</span>`;
  document.body.appendChild(cell);
  R3.still(cell.firstChild, board, roll);
}
// ?toss: 던지는 도중을 몇 순간 멈춰 그린다(판 크기 상자 위에서)
if (new URLSearchParams(location.search).has('toss')) {
  document.body.innerHTML = '';
  document.body.style.gridTemplateColumns = 'repeat(3, 200px)';
  for (const f of [3, 'express']) for (const t of [0.3, 0.6, 1]) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = `<div style="position:relative;width:200px;height:175px;background:#EADCC4"></div><span>${f} · ${Math.round(t * 100)}%</span>`;
    document.body.appendChild(cell);
    await R3.toss(cell.firstChild, board, { face: f }, 'me', t);
  }
}
window.done = true;
</script>
</body>
</html>
